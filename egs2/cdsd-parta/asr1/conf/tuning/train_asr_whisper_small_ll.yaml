normalize: null

encoder: whisper
encoder_conf:
    whisper_model: small
    dropout_rate: 0.0
    # do_pad_trim: true         # should be set when doing zero-shot inference

decoder: whisper
decoder_conf:
    whisper_model: small
    dropout_rate: 0.0

preprocessor: default
preprocessor_conf:
    whisper_language: "zh"
    whisper_task: "transcribe"
    
model_conf:
    ctc_weight: 0.0
    lsm_weight: 0.1
    length_normalized_loss: false
    extract_feats_in_collect_stats: false
    sym_sos: "<|startoftranscript|>"
    sym_eos: "<|endoftext|>"

frontend: null
input_size: 1                  # to prevent build_model() from complaining

seed: 2022
log_interval: 100
num_att_plot: 0
num_workers: 4
sort_in_batch: descending       # how to sort data in making batch
sort_batch: descending          # how to sort created batches
batch_type: folded
batch_size: 10
accum_grad: 1
max_epoch: 7
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 3

use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

optim: adamw
grad_clip: 1.0
optim_conf:
    lr: 7.5e-4 #5.0e-04                 # 保持 5e-4 很好！旁路微调通常需要比全量微调大 10~50 倍的学习率
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.99
    eps: 1.0e-06
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 1500

# ========================================================
# 🚀 修改后的因式分解双路旁路（Factorized Side-Branch）配置
# ========================================================
use_adapter: false              # 必须设为 false！关闭 ESPnet 原厂的 LoRA 挂载逻辑，改用我们手写的注入
save_strategy: required_grad_only # 保持不变，极其关键！告诉 ESPnet 只保存 requires_grad=True 的参数（即只存旁路矩阵，不存Whisper主干）